<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>卒防智控 · 管理后台</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root {
    --primary: #2F80ED;
    --primary-dark: #1E5FBF;
    --bg: #f5f7fa;
    --card: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --line: #e5e7eb;
    --danger: #EF4444;
    --success: #0E9F6E;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  button { font-family: inherit; cursor: pointer; }
  input { font-family: inherit; }

  /* ---------- 登录 ---------- */
  .login-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #EAF3FF, #DCEBFF);
    padding: 20px;
  }
  .login-card {
    width: 100%;
    max-width: 380px;
    background: #fff;
    border-radius: 18px;
    padding: 34px 30px;
    box-shadow: 0 12px 40px rgba(15, 23, 42, 0.12);
  }
  .login-logo {
    width: 52px; height: 52px; border-radius: 14px;
    background: var(--primary); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; font-weight: 700; margin-bottom: 16px;
  }
  .login-title { font-size: 22px; font-weight: 700; margin: 0 0 6px; }
  .login-sub { font-size: 13px; color: var(--muted); margin-bottom: 24px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .field input {
    width: 100%; height: 44px; padding: 0 14px;
    border: 1px solid var(--line); border-radius: 10px;
    font-size: 15px; outline: none; transition: border-color .2s;
  }
  .field input:focus { border-color: var(--primary); }
  .btn-primary {
    width: 100%; height: 44px; border: none; border-radius: 10px;
    background: var(--primary); color: #fff; font-size: 15px; font-weight: 600;
  }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-primary:disabled { opacity: .6; cursor: not-allowed; }
  .login-err { color: var(--danger); font-size: 13px; margin-top: 12px; min-height: 18px; }

  /* ---------- 主框架 ---------- */
  .app { display: none; min-height: 100vh; }
  .app.ready { display: flex; }
  .sidebar {
    width: 210px; flex-shrink: 0;
    background: #fff; border-right: 1px solid var(--line);
    display: flex; flex-direction: column; padding: 20px 14px;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 0 8px 20px; }
  .brand-icon {
    width: 34px; height: 34px; border-radius: 10px; background: var(--primary);
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 16px;
  }
  .brand-text { font-size: 15px; font-weight: 700; }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 12px; border-radius: 10px;
    font-size: 14px; color: var(--muted); margin-bottom: 4px;
    border: none; background: transparent; width: 100%; text-align: left;
  }
  .nav-item:hover { background: #f3f6fb; }
  .nav-item.active { background: #eff6ff; color: var(--primary); font-weight: 600; }
  .nav-dot {
    margin-left: auto; min-width: 18px; height: 18px; line-height: 18px;
    border-radius: 9px; background: var(--danger); color: #fff;
    font-size: 11px; text-align: center; padding: 0 5px;
  }
  .sidebar-foot { margin-top: auto; padding-top: 16px; border-top: 1px solid var(--line); }
  .user-line { font-size: 13px; color: var(--muted); padding: 0 8px 10px; }
  .logout-btn {
    width: 100%; padding: 9px; border-radius: 9px; border: 1px solid var(--line);
    background: #fff; color: var(--muted); font-size: 13px;
  }

  .main { flex: 1; min-width: 0; padding: 24px 28px 40px; }
  .page-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
  .page-title { font-size: 22px; font-weight: 700; margin: 0; }
  .page-sub { font-size: 13px; color: var(--muted); margin-top: 4px; }

  /* ---------- 看板 ---------- */
  .tabs {
    display: flex; gap: 6px; flex-wrap: wrap;
    background: #fff; border-radius: 14px; padding: 6px;
    box-shadow: 0 4px 16px rgba(15, 23, 42, 0.04); margin-bottom: 14px;
    width: fit-content;
  }
  .tab {
    height: 36px; padding: 0 20px; border-radius: 10px;
    border: none; background: transparent; font-size: 14px; color: var(--muted);
  }
  .tab:hover { background: #f3f6fb; color: var(--text); }
  .tab.active { background: var(--primary); color: #fff; font-weight: 600; }

  .custom-bar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: #fff; border-radius: 14px; padding: 12px 16px; margin-bottom: 14px;
    box-shadow: 0 4px 16px rgba(15, 23, 42, 0.04);
  }
  .custom-bar input[type="date"] {
    height: 36px; padding: 0 10px; border: 1px solid var(--line);
    border-radius: 9px; font-size: 13px; color: var(--text);
  }
  .apply-btn {
    height: 34px; padding: 0 18px; border: none; border-radius: 9px;
    background: var(--primary); color: #fff; font-size: 13px; font-weight: 600;
  }

  .period-head {
    display: flex; align-items: baseline; gap: 10px; margin: 4px 2px 10px;
  }
  .period-name { font-size: 17px; font-weight: 700; }
  .period-range { font-size: 13px; color: var(--muted); }

  .group-label {
    font-size: 13px; font-weight: 600; color: var(--muted);
    margin: 16px 2px 8px; letter-spacing: .5px;
  }

  .stat-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 14px; margin-bottom: 18px;
  }
  .stat-card {
    background: #fff; border-radius: 14px; padding: 18px 18px 16px;
    box-shadow: 0 4px 16px rgba(15, 23, 42, 0.04);
  }
  .stat-label { font-size: 13px; color: var(--muted); }
  .stat-value { font-size: 27px; font-weight: 700; margin-top: 8px; color: var(--text); }
  .stat-value small { font-size: 14px; font-weight: 500; color: var(--muted); margin-left: 4px; }
  .stat-note { font-size: 12px; color: #9ca3af; margin-top: 6px; }

  .panel {
    background: #fff; border-radius: 14px; padding: 18px;
    box-shadow: 0 4px 16px rgba(15, 23, 42, 0.04); margin-bottom: 18px;
  }
  .panel-title { font-size: 15px; font-weight: 600; margin: 0 0 14px; }
  .chart-box { position: relative; height: 320px; }

  /* ---------- 评估记录 ---------- */
  .head-actions { display: flex; gap: 8px; }
  .btn-ghost-sm {
    height: 32px; padding: 0 14px; border-radius: 8px;
    border: 1px solid var(--line); background: #fff;
    font-size: 13px; color: var(--muted);
  }
  .btn-ghost-sm:hover { border-color: var(--primary); color: var(--primary); }
  .btn-danger-outline {
    height: 32px; padding: 0 14px; border-radius: 8px;
    border: 1px solid #fecaca; background: #fff; color: var(--danger);
    font-size: 13px;
  }
  .btn-danger-outline:hover { background: #fef2f2; }

  .filters {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: #fff; border-radius: 14px; padding: 12px 16px; margin-bottom: 14px;
    box-shadow: 0 4px 16px rgba(15, 23, 42, 0.04);
  }
  .filters input, .filters select {
    height: 34px; padding: 0 10px; border: 1px solid var(--line);
    border-radius: 8px; font-size: 13px; color: var(--text); background: #fff;
    outline: none;
  }
  .filters input:focus, .filters select:focus { border-color: var(--primary); }
  #recordSearch { width: 180px; }
  .muted { font-size: 13px; color: var(--muted); margin-left: auto; }

  .table-panel { padding: 0; overflow: hidden; }
  .data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .data-table thead th {
    text-align: left; padding: 12px 14px; background: #f8fafc;
    color: var(--muted); font-weight: 600; white-space: nowrap;
    border-bottom: 1px solid var(--line);
  }
  .data-table tbody td {
    padding: 12px 14px; border-bottom: 1px solid #f1f5f9; vertical-align: middle;
  }
  .data-table tbody tr:hover { background: #f8fafc; }
  .data-table tbody tr:last-child td { border-bottom: none; }
  .data-table th.check, .data-table td.check { width: 42px; text-align: center; padding-left: 10px; padding-right: 0; }
  .data-table input[type="checkbox"] {
    width: 16px; height: 16px; accent-color: var(--primary); cursor: pointer; vertical-align: middle;
  }
  .data-table tbody tr.selected { background: #eff6ff; }
  .btn-danger-outline:disabled {
    opacity: .45; cursor: not-allowed; background: #fff;
  }
  .risk-tag {
    display: inline-block; padding: 2px 10px; border-radius: 10px;
    font-size: 12px; font-weight: 600;
  }
  .risk-tag.high { background: #fee2e2; color: #b91c1c; }
  .risk-tag.medium { background: #ffedd5; color: #c2410c; }
  .risk-tag.low { background: #dcfce7; color: #15803d; }
  .risk-tag.default { background: #e5e7eb; color: #4b5563; }
  .link-btn {
    border: none; background: transparent; color: var(--primary);
    font-size: 13px; padding: 0; margin-right: 10px;
  }
  .link-btn.danger { color: var(--danger); }

  .modal-mask {
    display: none; position: fixed; inset: 0; background: rgba(17,24,39,.45);
    z-index: 50; align-items: center; justify-content: center; padding: 20px;
  }
  .modal-mask.show { display: flex; }
  .modal-box {
    background: #fff; border-radius: 16px; width: 100%; max-width: 720px;
    max-height: 88vh; display: flex; flex-direction: column;
    box-shadow: 0 20px 60px rgba(15, 23, 42, 0.25);
  }
  .modal-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px; border-bottom: 1px solid var(--line);
    font-size: 16px; font-weight: 700;
  }
  .modal-close {
    border: none; background: transparent; font-size: 24px; line-height: 1;
    color: var(--muted); padding: 0 4px;
  }
  .modal-body { padding: 18px 20px; overflow-y: auto; }
  .modal-foot {
    display: flex; justify-content: space-between; gap: 10px;
    padding: 14px 20px; border-top: 1px solid var(--line);
  }
  .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 18px; }
  .detail-item { font-size: 13px; }
  .detail-item .k { color: var(--muted); margin-right: 6px; }
  .detail-item .v { color: var(--text); font-weight: 500; }

  /* 详情弹窗 */
  .rec-hero {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 18px 20px; border-radius: 14px; margin-bottom: 18px;
    background: linear-gradient(135deg, #EAF3FF, #F6FAFF);
  }
  .rec-hero.high { background: linear-gradient(135deg, #FEF2F2, #FFF8F8); }
  .rec-hero.medium { background: linear-gradient(135deg, #FFF7ED, #FFFCF6); }
  .rec-hero.low { background: linear-gradient(135deg, #F0FDF4, #F8FEF9); }
  .rec-name { font-size: 20px; font-weight: 700; color: #111827; }
  .rec-sub { font-size: 13px; color: #6b7280; margin-top: 6px; }
  .rec-right { text-align: right; }
  .rec-prob { font-size: 32px; font-weight: 800; line-height: 1; color: var(--primary); }
  .rec-hero.high .rec-prob { color: #b91c1c; }
  .rec-hero.medium .rec-prob { color: #c2410c; }
  .rec-hero.low .rec-prob { color: #15803d; }
  .rec-prob-label { font-size: 12px; color: #6b7280; margin-top: 6px; }

  .sec { margin-bottom: 18px; }
  .sec-title {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; font-weight: 700; color: #374151;
    margin-bottom: 10px; letter-spacing: .3px;
  }
  .sec-title::before {
    content: ''; width: 4px; height: 14px; border-radius: 2px; background: var(--primary);
  }
  .kv-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px 12px; }
  .kv {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 9px 12px; border-radius: 9px; background: #f8fafc; font-size: 13px;
  }
  .kv .k { color: #6b7280; flex-shrink: 0; }
  .kv .v { color: #1f2937; font-weight: 600; text-align: right; word-break: break-all; }

  .metric-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .metric-box { background: #f8fafc; border-radius: 10px; padding: 11px 12px; }
  .metric-box .m { font-size: 17px; font-weight: 700; color: #111827; }
  .metric-box .m small { font-size: 11px; font-weight: 500; color: #9ca3af; margin-left: 2px; }
  .metric-box .lab { font-size: 11px; color: #9ca3af; margin-top: 3px; }

  .factor-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .factor-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 12px; border-radius: 9px; background: #f8fafc; font-size: 13px;
  }
  .factor-row.hit { background: #FEF2F2; }
  .factor-row .fname { color: #374151; }
  .factor-row .yes { color: #b91c1c; font-weight: 700; }
  .factor-row .no { color: #9ca3af; }

  .factor-chip {
    display: inline-block; padding: 4px 12px; margin: 0 6px 6px 0;
    border-radius: 12px; background: #eff6ff; color: var(--primary);
    font-size: 12px; font-weight: 500;
  }
  .detail-section { margin-top: 16px; }
  .detail-section h4 {
    font-size: 13px; color: var(--muted); font-weight: 600;
    margin: 0 0 8px; letter-spacing: .5px;
  }
  @media (max-width: 720px) {
    .detail-grid { grid-template-columns: 1fr; }
    .data-table { font-size: 12px; }
    .data-table thead th, .data-table tbody td { padding: 10px 8px; }
  }

  /* ---------- 客服 ---------- */
  .support-layout {
    display: grid; grid-template-columns: 300px 1fr; gap: 16px;
    height: calc(100vh - 130px); min-height: 460px;
  }
  .thread-panel, .chat-panel {
    background: #fff; border-radius: 14px;
    box-shadow: 0 4px 16px rgba(15, 23, 42, 0.04);
    display: flex; flex-direction: column; min-height: 0;
  }
  .thread-head, .chat-head {
    padding: 14px 16px; border-bottom: 1px solid var(--line);
    font-size: 14px; font-weight: 600; flex-shrink: 0;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .thread-list { overflow-y: auto; flex: 1; }
  .thread-item {
    padding: 12px 16px; border-bottom: 1px solid #f8fafc; cursor: pointer;
  }
  .thread-item:hover { background: #f8fafc; }
  .thread-item.active { background: #eff6ff; }
  .thread-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .thread-name { font-size: 14px; font-weight: 600; }
  .thread-time { font-size: 11px; color: #9ca3af; }
  .thread-last {
    font-size: 12px; color: var(--muted); margin-top: 4px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .thread-unread {
    min-width: 18px; height: 18px; line-height: 18px; border-radius: 9px;
    background: var(--danger); color: #fff; font-size: 11px; text-align: center; padding: 0 5px;
  }
  .empty-hint { padding: 40px 20px; text-align: center; color: #9ca3af; font-size: 13px; }

  .chat-body { flex: 1; overflow-y: auto; padding: 16px; background: #fafbfd; }
  .chat-empty {
    height: 100%; display: flex; align-items: center; justify-content: center;
    color: #9ca3af; font-size: 13px;
  }
  .msg-row { display: flex; margin-bottom: 12px; }
  .msg-row.admin { justify-content: flex-end; }
  .msg-bubble {
    max-width: 70%; padding: 10px 13px; border-radius: 12px;
    font-size: 14px; line-height: 1.55; white-space: pre-wrap; word-break: break-word;
  }
  .msg-row.user .msg-bubble { background: #fff; box-shadow: 0 2px 8px rgba(15,23,42,.06); }
  .msg-row.admin .msg-bubble { background: var(--primary); color: #fff; }
  .msg-time { display: block; font-size: 11px; margin-top: 4px; opacity: .65; }

  .chat-input { display: flex; gap: 10px; padding: 12px 14px; border-top: 1px solid var(--line); flex-shrink: 0; }
  .chat-input input {
    flex: 1; height: 40px; padding: 0 14px; border: 1px solid var(--line);
    border-radius: 20px; font-size: 14px; outline: none;
  }
  .chat-input input:focus { border-color: var(--primary); }
  .chat-input button {
    height: 40px; padding: 0 22px; border: none; border-radius: 20px;
    background: var(--primary); color: #fff; font-size: 14px; font-weight: 600;
  }
  .chat-input button:disabled { opacity: .5; cursor: not-allowed; }
  .btn-danger-ghost {
    border: 1px solid #fecaca; color: var(--danger); background: #fff;
    height: 28px; padding: 0 12px; border-radius: 8px; font-size: 12px;
  }
  .toast {
    position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%);
    background: rgba(17,24,39,.9); color: #fff; padding: 10px 18px;
    border-radius: 10px; font-size: 13px; opacity: 0; pointer-events: none;
    transition: opacity .25s; z-index: 99;
  }
  .toast.show { opacity: 1; }

  @media (max-width: 820px) {
    .app.ready { flex-direction: column; }
    .sidebar { width: 100%; flex-direction: row; align-items: center; padding: 10px; overflow-x: auto; }
    .brand { padding: 0 12px 0 0; }
    .sidebar-foot { border: none; margin: 0 0 0 auto; padding: 0; }
    .user-line { display: none; }
    .main { padding: 16px; }
    .support-layout { grid-template-columns: 1fr; height: auto; }
    .thread-panel { max-height: 260px; }
    .chat-panel { min-height: 420px; }
  }
</style>
</head>
<body>

<!-- 登录 -->
<div class="login-wrap" id="loginView">
  <div class="login-card">
    <div class="login-logo">卒</div>
    <h1 class="login-title">卒防智控 · 管理后台</h1>
    <p class="login-sub">请使用管理员账号登录</p>
    <form id="loginForm">
      <div class="field">
        <label>账号</label>
        <input id="username" autocomplete="username" placeholder="请输入管理员账号" />
      </div>
      <div class="field">
        <label>密码</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="请输入密码" />
      </div>
      <button class="btn-primary" id="loginBtn" type="submit">登录</button>
      <div class="login-err" id="loginErr"></div>
    </form>
  </div>
</div>

<!-- 主界面 -->
<div class="app" id="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-icon">卒</div>
      <div class="brand-text">管理后台</div>
    </div>
    <button class="nav-item active" data-view="dashboard">📊 数据看板</button>
    <button class="nav-item" data-view="records">📋 评估记录</button>
    <button class="nav-item" data-view="support">💬 客服消息 <span class="nav-dot" id="navUnread" style="display:none">0</span></button>
    <div class="sidebar-foot">
      <div class="user-line" id="userLine">管理员</div>
      <button class="logout-btn" id="logoutBtn">退出登录</button>
    </div>
  </aside>

  <main class="main">
    <!-- 看板 -->
    <section id="viewDashboard">
      <div class="page-head">
        <div>
          <h2 class="page-title">数据看板</h2>
          <div class="page-sub">小程序使用情况统计（北京时间）</div>
        </div>
      </div>

      <div class="tabs" id="periodTabs">
        <button class="tab active" data-tab="today">今日</button>
        <button class="tab" data-tab="yesterday">昨日</button>
        <button class="tab" data-tab="last3">近三天</button>
        <button class="tab" data-tab="month">本月</button>
        <button class="tab" data-tab="custom">自定义</button>
      </div>

      <div class="custom-bar" id="customBar" style="display:none">
        <input type="date" id="fromDate" />
        <span style="color:#9ca3af">至</span>
        <input type="date" id="toDate" />
        <button class="apply-btn" id="applyRange">查询</button>
      </div>

      <div class="period-head">
        <span class="period-name" id="periodTitle">今日</span>
        <span class="period-range" id="periodRange"></span>
      </div>

      <div class="group-label">本阶段数据</div>
      <div class="stat-grid" id="periodStats"></div>

      <div class="group-label">累计数据</div>
      <div class="stat-grid" id="totalStats"></div>

      <div class="panel">
        <h3 class="panel-title">每日趋势</h3>
        <div class="chart-box" id="chartBox"><canvas id="trendChart"></canvas></div>
        <div class="empty-hint" id="chartEmpty" style="display:none">
          单日没有趋势曲线，切到「近三天 / 本月」或自定义多日区间查看。
        </div>
      </div>
    </section>

    <!-- 评估记录 -->
    <section id="viewRecords" style="display:none">
      <div class="page-head">
        <div>
          <h2 class="page-title">评估记录</h2>
          <div class="page-sub">小程序与网站提交的评估都会同步到这里</div>
        </div>
        <div class="head-actions">
          <button class="btn-danger-outline" id="deleteSelected" disabled>删除选中 (0)</button>
          <button class="btn-ghost-sm" id="exportRecords">导出 CSV</button>
          <button class="btn-ghost-sm" id="refreshRecords">刷新</button>
        </div>
      </div>

      <div class="filters">
        <input id="recordSearch" placeholder="按姓名搜索" />
        <select id="recordRisk">
          <option value="">全部风险</option>
          <option value="高风险">高风险</option>
          <option value="中风险">中风险</option>
          <option value="低风险">低风险</option>
          <option value="极低风险">极低风险</option>
        </select>
        <select id="recordSource">
          <option value="">全部来源</option>
          <option value="miniprogram">小程序</option>
          <option value="web">网站</option>
        </select>
        <input type="date" id="recordFrom" />
        <span style="color:#9ca3af">至</span>
        <input type="date" id="recordTo" />
        <span class="muted" id="recordCount"></span>
      </div>

      <div class="panel table-panel">
        <table class="data-table">
          <thead>
            <tr>
              <th class="check"><input type="checkbox" id="selectAll" /></th>
              <th>姓名</th>
              <th>年龄/性别</th>
              <th>风险等级</th>
              <th>患病概率</th>
              <th>评估时间</th>
              <th>来源</th>
              <th>评估人员</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="recordRows"></tbody>
        </table>
        <div class="empty-hint" id="recordEmpty" style="display:none">暂无评估记录</div>
      </div>
    </section>

    <!-- 客服 -->
    <section id="viewSupport" style="display:none">
      <div class="page-head">
        <div>
          <h2 class="page-title">客服消息</h2>
          <div class="page-sub">用户在小程序「我的 → 客服」中发送的消息</div>
        </div>
      </div>
      <div class="support-layout">
        <div class="thread-panel">
          <div class="thread-head">
            <span>会话列表</span>
            <button class="btn-danger-ghost" id="refreshThreads">刷新</button>
          </div>
          <div class="thread-list" id="threadList">
            <div class="empty-hint">加载中...</div>
          </div>
        </div>
        <div class="chat-panel">
          <div class="chat-head">
            <span id="chatTitle">请选择会话</span>
            <button class="btn-danger-ghost" id="deleteThread" style="display:none">删除会话</button>
          </div>
          <div class="chat-body" id="chatBody">
            <div class="chat-empty">从左侧选择一个用户会话</div>
          </div>
          <div class="chat-input">
            <input id="replyInput" placeholder="输入回复内容..." maxlength="500" disabled />
            <button id="sendReply" disabled>发送</button>
          </div>
        </div>
      </div>
    </section>
  </main>
</div>

<!-- 评估详情 -->
<div class="modal-mask" id="recordModal">
  <div class="modal-box">
    <div class="modal-head">
      <span id="recordModalTitle">评估详情</span>
      <button class="modal-close" id="recordModalClose">×</button>
    </div>
    <div class="modal-body" id="recordModalBody"></div>
    <div class="modal-foot">
      <button class="btn-danger-ghost" id="recordDeleteBtn">删除这条记录</button>
      <button class="btn-ghost-sm" id="recordModalOk">关闭</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  const API_BASE = 'https://significant-donkey-d5cfzd9b35604-1419360854.ap-shanghai.app.tcloudbase.com/api';
  const TOKEN_KEY = 'stroke_admin_token';
  const USER_KEY = 'stroke_admin_user';
  const LOGIN_AT_KEY = 'stroke_admin_login_at';
  const SESSION_TTL_MS = 6 * 60 * 60 * 1000;

  const $ = (id) => document.getElementById(id);

  let token = localStorage.getItem(TOKEN_KEY) || '';
  let currentUser = null;
  try { currentUser = JSON.parse(localStorage.getItem(USER_KEY) || 'null'); } catch (e) { currentUser = null; }
  let chart = null;
  let activeThreadId = null;
  let chatTimer = null;
  let listTimer = null;
  let sessionTimer = null;

  function toast(msg) {
    const el = $('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(el._t);
    el._t = setTimeout(() => el.classList.remove('show'), 2200);
  }

  function pad(n) { return n < 10 ? '0' + n : String(n); }
  function dateStr(d) {
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }
  function todayStr() { return dateStr(new Date()); }
  function shiftDays(n) {
    const d = new Date();
    d.setDate(d.getDate() + n);
    return dateStr(d);
  }
  function fmtNum(n) { return (Number(n) || 0).toLocaleString('zh-CN'); }
  function fmtTime(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    if (Number.isNaN(d.getTime())) return String(iso).slice(0, 16);
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }
  function fmtShort(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    if (Number.isNaN(d.getTime())) return '';
    return `${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  async function api(action, payload) {
    const res = await fetch(API_BASE, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action, token, payload: payload || {} })
    });
    let body = {};
    try { body = await res.json(); } catch (e) { body = {}; }
    if (!body.ok) {
      const err = new Error((body.error && body.error.message) || '请求失败');
      err.code = body.error && body.error.code;
      if (err.code === 'UNAUTHORIZED' || err.code === 'TOKEN_EXPIRED' || err.code === 'SESSION_REPLACED') {
        logout(true, err.message || '登录已失效，请重新登录');
      }
      throw err;
    }
    return body.data;
  }

  /* ---------- 登录 ---------- */
  function showApp() {
    $('loginView').style.display = 'none';
    $('app').classList.add('ready');
    $('userLine').textContent = (currentUser && (currentUser.displayName || currentUser.username)) || '管理员';
    scheduleSessionEnd();
    initDashboard();
    initRecords();
    loadThreads();
    startThreadPolling();
  }

  // 6 小时后强制重新登录（服务端令牌同样 6 小时）
  function scheduleSessionEnd() {
    clearTimeout(sessionTimer);
    const loginAt = Number(localStorage.getItem(LOGIN_AT_KEY)) || Date.now();
    const remain = SESSION_TTL_MS - (Date.now() - loginAt);
    if (remain <= 0) {
      logout(true, '登录已超时，请重新输入账号密码');
      return;
    }
    sessionTimer = setTimeout(() => {
      logout(true, '登录已超时，请重新输入账号密码');
    }, remain);
  }

  function logout(silent, message) {
    token = '';
    currentUser = null;
    localStorage.removeItem(TOKEN_KEY);
    localStorage.removeItem(USER_KEY);
    localStorage.removeItem(LOGIN_AT_KEY);
    clearTimeout(sessionTimer);
    sessionTimer = null;
    stopChatTimer();
    stopListTimer();
    $('app').classList.remove('ready');
    $('loginView').style.display = 'flex';
    $('loginErr').textContent = message || '';
    if (!silent && !message) toast('已退出登录');
  }

  $('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errEl = $('loginErr');
    errEl.textContent = '';
    const username = $('username').value.trim();
    const password = $('password').value;
    if (!username || !password) { errEl.textContent = '请输入账号和密码'; return; }

    const btn = $('loginBtn');
    btn.disabled = true;
    btn.textContent = '登录中...';
    try {
      const data = await api('login', { username, password });
      if (!data.user || data.user.role !== 'admin') {
        errEl.textContent = '该账号不是管理员，无法进入后台';
        return;
      }
      token = data.token;
      currentUser = data.user;
      localStorage.setItem(TOKEN_KEY, token);
      localStorage.setItem(USER_KEY, JSON.stringify(currentUser));
      localStorage.setItem(LOGIN_AT_KEY, String(Date.now()));
      $('loginErr').textContent = '';
      showApp();
    } catch (err) {
      errEl.textContent = err.message || '登录失败';
    } finally {
      btn.disabled = false;
      btn.textContent = '登录';
    }
  });

  $('logoutBtn').addEventListener('click', () => logout(false));

  /* ---------- 导航 ---------- */
  document.querySelectorAll('.nav-item').forEach((btn) => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.nav-item').forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      const view = btn.dataset.view;
      $('viewDashboard').style.display = view === 'dashboard' ? 'block' : 'none';
      $('viewRecords').style.display = view === 'records' ? 'block' : 'none';
      $('viewSupport').style.display = view === 'support' ? 'block' : 'none';
      if (view === 'dashboard') loadStats();
      if (view === 'records') loadRecords();
      if (view === 'support') loadThreads();
    });
  });

  /* ---------- 看板 ---------- */
  const TAB_LABELS = { today: '今日', yesterday: '昨日', last3: '近三天', month: '本月', custom: '自定义' };
  let currentTab = 'today';

  function initDashboard() {
    $('fromDate').value = shiftDays(-6);
    $('toDate').value = todayStr();

    document.querySelectorAll('#periodTabs .tab').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#periodTabs .tab').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        currentTab = btn.dataset.tab;
        $('customBar').style.display = currentTab === 'custom' ? 'flex' : 'none';
        loadStats();
      });
    });

    $('applyRange').addEventListener('click', loadStats);
    loadStats();
  }

  function tabRange(tab) {
    const today = todayStr();
    if (tab === 'today') return { from: today, to: today };
    if (tab === 'yesterday') {
      const y = shiftDays(-1);
      return { from: y, to: y };
    }
    if (tab === 'last3') return { from: shiftDays(-2), to: today };
    if (tab === 'month') {
      const d = new Date();
      return { from: `${d.getFullYear()}-${pad(d.getMonth() + 1)}-01`, to: today };
    }
    return { from: $('fromDate').value, to: $('toDate').value };
  }

  function statCard(label, value, note, unit) {
    return `<div class="stat-card">
      <div class="stat-label">${label}</div>
      <div class="stat-value">${fmtNum(value)}${unit ? `<small>${unit}</small>` : ''}</div>
      <div class="stat-note">${note || ''}</div>
    </div>`;
  }

  async function loadStats() {
    const { from, to } = tabRange(currentTab);
    if (!from || !to) { toast('请选择日期范围'); return; }
    if (from > to) { toast('开始日期不能晚于结束日期'); return; }

    try {
      const data = await api('adminStats', { from, to });
      const period = (data.periods && (data.periods[currentTab] || data.periods.custom)) || {};
      renderPeriod(currentTab, period);
      renderTotals(data.totals || {});
      renderChart(data.series || []);
    } catch (err) {
      if (err.code !== 'UNAUTHORIZED' && err.code !== 'TOKEN_EXPIRED') toast(err.message || '统计数据加载失败');
    }
  }

  function renderPeriod(tab, p) {
    $('periodTitle').textContent = TAB_LABELS[tab] || '所选区间';
    $('periodRange').textContent = p.from
      ? (p.from === p.to ? p.from : `${p.from} ~ ${p.to}`)
      : '';

    $('periodStats').innerHTML = [
      statCard('使用人数', p.users, '打开过小程序的用户', '人'),
      statCard('使用次数', p.opens, '打开小程序的次数', '次'),
      statCard('评估人数', p.assessmentUsers, '提交过评估的用户', '人'),
      statCard('评估次数', p.assessments, '提交评估的次数', '次')
    ].join('');
  }

  function renderTotals(totals) {
    $('totalStats').innerHTML = [
      statCard('累计注册用户', totals.users, '全部账号数', '人'),
      statCard('累计评估次数', totals.assessments, '全部评估记录', '次')
    ].join('');
  }

  function renderChart(series) {
    const multi = series.length > 1;
    $('chartBox').style.display = multi ? 'block' : 'none';
    $('chartEmpty').style.display = multi ? 'none' : 'block';
    if (!multi) {
      if (chart) { chart.destroy(); chart = null; }
      return;
    }

    const labels = series.map((s) => s.date.slice(5));
    const ctx = $('trendChart').getContext('2d');
    if (chart) { chart.destroy(); chart = null; }
    chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels,
        datasets: [
          {
            label: '使用人数',
            data: series.map((s) => s.users),
            borderColor: '#2F80ED',
            backgroundColor: 'rgba(47,128,237,0.12)',
            fill: true, tension: 0.3, borderWidth: 2, pointRadius: 2
          },
          {
            label: '使用次数',
            data: series.map((s) => s.opens),
            borderColor: '#0E9F6E',
            backgroundColor: 'rgba(14,159,110,0.10)',
            fill: false, tension: 0.3, borderWidth: 2, pointRadius: 2
          },
          {
            label: '评估次数',
            data: series.map((s) => s.assessments),
            borderColor: '#F2994A',
            backgroundColor: 'rgba(242,153,74,0.10)',
            fill: false, tension: 0.3, borderWidth: 2, pointRadius: 2, borderDash: [5, 4]
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: { legend: { position: 'top' } },
        scales: {
          y: { beginAtZero: true, ticks: { precision: 0 }, grid: { color: '#f1f5f9' } },
          x: { grid: { display: false } }
        }
      }
    });
  }

  /* ---------- 评估记录 ---------- */
  let allRecords = [];
  let filteredRecords = [];
  let currentRecordId = null;
  const selectedIds = new Set();

  const SOURCE_LABEL = { miniprogram: '小程序', web: '网站' };
  const YES_NO = (v) => (v === true || v === 1 || v === '1' || v === '是') ? '是' : '否';

  function localDay(value) {
    if (!value) return '';
    const d = new Date(value);
    if (Number.isNaN(d.getTime())) return String(value).slice(0, 10);
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }

  function riskClass(level) {
    if (level === '高风险') return 'high';
    if (level === '中风险') return 'medium';
    if (level === '低风险') return 'low';
    return 'default';
  }

  async function loadRecords() {
    $('recordRows').innerHTML = '<tr><td colspan="9" style="text-align:center;color:#9ca3af;padding:30px">加载中...</td></tr>';
    $('recordEmpty').style.display = 'none';
    try {
      const data = await api('listAssessments', { limit: 500 });
      allRecords = (data.items || []).map((item) => ({
        ...item,
        dateText: fmtTime(item.date || item.createdAt),
        dayKey: localDay(item.date || item.createdAt)
      }));
      applyRecordFilters();
    } catch (err) {
      if (err.code !== 'UNAUTHORIZED' && err.code !== 'TOKEN_EXPIRED' && err.code !== 'SESSION_REPLACED') {
        toast(err.message || '加载失败');
      }
    }
  }

  function applyRecordFilters() {
    selectedIds.clear();
    const kw = ($('recordSearch').value || '').trim();
    const risk = $('recordRisk').value;
    const source = $('recordSource').value;
    const from = $('recordFrom').value;
    const to = $('recordTo').value;

    filteredRecords = allRecords.filter((r) => {
      if (kw && !String(r.patientName || '').includes(kw)) return false;
      if (risk && r.riskLevel !== risk) return false;
      if (source && r.source !== source) return false;
      if (from && r.dayKey && r.dayKey < from) return false;
      if (to && r.dayKey && r.dayKey > to) return false;
      return true;
    });
    renderRecords();
  }

  function renderRecords() {
    $('recordCount').textContent = `共 ${filteredRecords.length} 条`;
    if (!filteredRecords.length) {
      $('recordRows').innerHTML = '';
      $('recordEmpty').style.display = 'block';
      updateSelectionState();
      return;
    }
    $('recordEmpty').style.display = 'none';
    $('recordRows').innerHTML = filteredRecords.map((r) => `
      <tr class="${selectedIds.has(String(r.id)) ? 'selected' : ''}">
        <td class="check"><input type="checkbox" data-check="${escapeHtml(String(r.id))}" ${selectedIds.has(String(r.id)) ? 'checked' : ''} /></td>
        <td>${escapeHtml(r.patientName || '未命名')}</td>
        <td>${escapeHtml(String(r.age || '--'))} / ${escapeHtml(r.gender || '--')}</td>
        <td><span class="risk-tag ${riskClass(r.riskLevel)}">${escapeHtml(r.riskLevel || '未分级')}</span></td>
        <td>${r.probability == null ? '--' : escapeHtml(String(r.probability)) + '%'}</td>
        <td>${escapeHtml(r.dateText || '')}</td>
        <td>${SOURCE_LABEL[r.source] || '—'}</td>
        <td>${escapeHtml(r.assessedBy || r.ownerName || '—')}</td>
        <td>
          <button class="link-btn" data-detail="${escapeHtml(String(r.id))}">查看</button>
          <button class="link-btn danger" data-delete="${escapeHtml(String(r.id))}">删除</button>
        </td>
      </tr>`).join('');

    $('recordRows').querySelectorAll('[data-detail]').forEach((btn) => {
      btn.addEventListener('click', () => openRecordDetail(btn.dataset.detail));
    });
    $('recordRows').querySelectorAll('[data-delete]').forEach((btn) => {
      btn.addEventListener('click', () => deleteRecord(btn.dataset.delete));
    });
    $('recordRows').querySelectorAll('[data-check]').forEach((box) => {
      box.addEventListener('change', () => {
        const id = String(box.dataset.check);
        if (box.checked) selectedIds.add(id);
        else selectedIds.delete(id);
        const row = box.closest('tr');
        if (row) row.classList.toggle('selected', box.checked);
        updateSelectionState();
      });
    });
    updateSelectionState();
  }

  function updateSelectionState() {
    const total = filteredRecords.length;
    const picked = filteredRecords.filter((r) => selectedIds.has(String(r.id))).length;
    const allBox = $('selectAll');
    allBox.checked = total > 0 && picked === total;
    allBox.indeterminate = picked > 0 && picked < total;

    const btn = $('deleteSelected');
    btn.textContent = `删除选中 (${selectedIds.size})`;
    btn.disabled = selectedIds.size === 0;
  }

  function kvRow(key, value) {
    return `<div class="kv"><span class="k">${escapeHtml(key)}</span><span class="v">${escapeHtml(String(value))}</span></div>`;
  }

  function metricBox(label, value, unit) {
    const text = (value === null || value === undefined || value === '') ? '--' : value;
    return `<div class="metric-box">
      <div class="m">${escapeHtml(String(text))}${unit && text !== '--' ? `<small>${unit}</small>` : ''}</div>
      <div class="lab">${escapeHtml(label)}</div>
    </div>`;
  }

  function openRecordDetail(id) {
    const r = allRecords.find((item) => String(item.id) === String(id));
    if (!r) return;
    currentRecordId = r.id;

    $('recordModalTitle').textContent = '评估详情';

    const cls = riskClass(r.riskLevel);
    const factors = Array.isArray(r.riskFactors) ? r.riskFactors : [];
    const heartText = r.heartDiseaseType === '1' ? '房颤或心梗'
      : (r.heartDiseaseType === '2' ? '其他心脏病' : '无');
    const familyText = { '1': '一级亲属', '2': '二级亲属', '0': '无' }[r.strokeFamilyHistory] || '未填';

    const factorRows = [
      ['高血压', YES_NO(r.hypertension)],
      ['糖尿病', YES_NO(r.diabetes)],
      ['心脏病', heartText],
      ['血脂异常', YES_NO(r.hyperlipidemia)],
      ['以前发生过中风', YES_NO(r.strokeHistory)],
      ['以前发生过短暂性脑缺血', YES_NO(r.tiaHistory)],
      ['脑卒中家族史', familyText],
      ['超重或肥胖（BMI≥24）', YES_NO(r.overweight)],
      ['吸烟', YES_NO(r.smoking)],
      ['运动缺乏', YES_NO(r.lackExercise)],
      ['饮酒', YES_NO(r.drinking)],
      ['其他家族遗传性疾病', YES_NO(r.otherFamilyHistory)]
    ];
    const isHit = (v) => v === '是' || ['房颤或心梗', '其他心脏病', '一级亲属', '二级亲属'].indexOf(v) !== -1;

    $('recordModalBody').innerHTML = `
      <div class="rec-hero ${cls}">
        <div>
          <div class="rec-name">${escapeHtml(r.patientName || '未命名')}</div>
          <div class="rec-sub">
            <span class="risk-tag ${cls}">${escapeHtml(r.riskLevel || '未分级')}</span>
            <span style="margin-left:8px">${escapeHtml(String(r.age || '--'))} 岁 · ${escapeHtml(r.gender || '--')}</span>
          </div>
          <div class="rec-sub">${escapeHtml(r.dateText || '')}　来源：${SOURCE_LABEL[r.source] || '—'}</div>
        </div>
        <div class="rec-right">
          <div class="rec-prob">${r.probability == null ? '--' : escapeHtml(String(r.probability))}<span style="font-size:15px">${r.probability == null ? '' : '%'}</span></div>
          <div class="rec-prob-label">患病概率</div>
        </div>
      </div>

      <div class="sec">
        <div class="sec-title">基本信息</div>
        <div class="kv-grid">
          ${kvRow('婚姻状况', r.everMarried || '--')}
          ${kvRow('职业类型', r.workType || '--')}
          ${kvRow('居住地', r.residenceType || '--')}
          ${kvRow('文化程度', r.education || '--')}
          ${kvRow('家庭月收入', r.monthlyIncome || '--')}
          ${kvRow('医疗费用承担方式', r.medicalInsurance || '--')}
        </div>
      </div>

      <div class="sec">
        <div class="sec-title">临床指标</div>
        <div class="metric-grid">
          ${metricBox('收缩压', r.systolicBP, 'mmHg')}
          ${metricBox('舒张压', r.diastolicBP, 'mmHg')}
          ${metricBox('空腹血糖', r.avgGlucoseLevel, 'mmol/L')}
          ${metricBox('身高', r.height, 'cm')}
          ${metricBox('体重', r.weight, 'kg')}
          ${metricBox('BMI', r.bmi)}
        </div>
      </div>

      <div class="sec">
        <div class="sec-title">高危因素（8+2）</div>
        <div class="factor-grid">
          ${factorRows.map(([k, v]) => `
            <div class="factor-row ${isHit(v) ? 'hit' : ''}">
              <span class="fname">${escapeHtml(k)}</span>
              <span class="${isHit(v) ? 'yes' : 'no'}">${escapeHtml(v || '--')}</span>
            </div>`).join('')}
        </div>
      </div>

      <div class="sec">
        <div class="sec-title">主要风险因素</div>
        ${factors.length
          ? factors.map((f) => `<span class="factor-chip">${escapeHtml(f)}</span>`).join('')
          : '<span style="color:#9ca3af;font-size:13px">未发现明显风险因素</span>'}
      </div>

      <div class="sec" style="margin-bottom:0">
        <div class="sec-title">评估信息</div>
        <div class="kv-grid">
          ${kvRow('评估时间', r.dateText || '--')}
          ${kvRow('评估人员', r.assessedBy || r.ownerName || '--')}
          ${kvRow('备注', r.notes || '--')}
          ${kvRow('风险等级', r.riskLevel || '--')}
        </div>
      </div>`;

    $('recordModal').classList.add('show');
  }

  function closeRecordModal() {
    $('recordModal').classList.remove('show');
    currentRecordId = null;
  }

  async function deleteRecord(id) {
    const r = allRecords.find((item) => String(item.id) === String(id));
    if (!r) return;
    if (!confirm(`确定删除「${r.patientName || '未命名'}」的这条评估记录吗？删除后不可恢复。`)) return;
    try {
      await api('deleteAssessment', { id });
      allRecords = allRecords.filter((item) => String(item.id) !== String(id));
      applyRecordFilters();
      if (String(currentRecordId) === String(id)) closeRecordModal();
      toast('已删除');
    } catch (err) {
      if (err.code !== 'UNAUTHORIZED' && err.code !== 'TOKEN_EXPIRED' && err.code !== 'SESSION_REPLACED') {
        toast(err.message || '删除失败');
      }
    }
  }

  function csvCell(value) {
    const s = String(value == null ? '' : value);
    return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }

  function exportRecords() {
    if (!filteredRecords.length) { toast('没有可导出的记录'); return; }
    const headers = ['姓名', '年龄', '性别', '风险等级', '患病概率(%)', '评估时间', '来源', '评估人员',
      '婚姻状况', '职业类型', '居住地', '文化程度', '家庭月收入', '医疗费用承担方式',
      '收缩压', '舒张压', '空腹血糖', '身高', '体重', 'BMI', '风险因素', '备注'];
    const lines = [headers];
    filteredRecords.forEach((r) => {
      lines.push([
        r.patientName || '', r.age || '', r.gender || '', r.riskLevel || '', r.probability == null ? '' : r.probability,
        r.dateText || '', SOURCE_LABEL[r.source] || '', r.assessedBy || r.ownerName || '',
        r.everMarried || '', r.workType || '', r.residenceType || '', r.education || '',
        r.monthlyIncome || '', r.medicalInsurance || '',
        r.systolicBP || '', r.diastolicBP || '', r.avgGlucoseLevel || '',
        r.height || '', r.weight || '', r.bmi || '',
        Array.isArray(r.riskFactors) ? r.riskFactors.join('、') : '', r.notes || ''
      ]);
    });
    const csv = '﻿' + lines.map((line) => line.map(csvCell).join(',')).join('\r\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `评估记录_${todayStr()}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast(`已导出 ${filteredRecords.length} 条`);
  }

  async function deleteSelected() {
    const ids = Array.from(selectedIds);
    if (!ids.length) {
      toast('请先勾选要删除的记录');
      return;
    }
    const n = ids.length;
    if (!confirm(`将删除选中的 ${n} 条评估记录，确定吗？`)) return;
    if (!confirm(`此操作不可恢复，建议先导出备份。\n\n再次确认：删除这 ${n} 条记录？`)) return;

    try {
      const res = await api('deleteAssessments', { ids });
      const removed = res && res.removed != null ? res.removed : ids.length;
      const idSet = new Set(ids.map(String));
      allRecords = allRecords.filter((r) => !idSet.has(String(r.id)));
      selectedIds.clear();
      applyRecordFilters();
      closeRecordModal();
      toast(`已删除 ${removed} 条`);
    } catch (err) {
      if (err.code !== 'UNAUTHORIZED' && err.code !== 'TOKEN_EXPIRED' && err.code !== 'SESSION_REPLACED') {
        toast(err.message || '删除失败');
      }
    }
  }

  function initRecords() {
    ['recordSearch', 'recordRisk', 'recordSource', 'recordFrom', 'recordTo'].forEach((id) => {
      $(id).addEventListener('input', applyRecordFilters);
      $(id).addEventListener('change', applyRecordFilters);
    });
    $('refreshRecords').addEventListener('click', loadRecords);
    $('exportRecords').addEventListener('click', exportRecords);
    $('deleteSelected').addEventListener('click', deleteSelected);
    $('selectAll').addEventListener('change', (e) => {
      selectedIds.clear();
      if (e.target.checked) {
        filteredRecords.forEach((r) => selectedIds.add(String(r.id)));
      }
      renderRecords();
    });
    $('recordModalClose').addEventListener('click', closeRecordModal);
    $('recordModalOk').addEventListener('click', closeRecordModal);
    $('recordDeleteBtn').addEventListener('click', () => {
      if (currentRecordId) deleteRecord(currentRecordId);
    });
    $('recordModal').addEventListener('click', (e) => {
      if (e.target === $('recordModal')) closeRecordModal();
    });
  }

  /* ---------- 客服 ---------- */
  function startThreadPolling() {
    stopListTimer();
    listTimer = setInterval(() => {
      if ($('viewSupport').style.display !== 'none') loadThreads(true);
      refreshUnread();
    }, 20000);
    refreshUnread();
  }
  function stopListTimer() { if (listTimer) { clearInterval(listTimer); listTimer = null; } }
  function startChatTimer() {
    stopChatTimer();
    chatTimer = setInterval(() => { if (activeThreadId) openThread(activeThreadId, true); }, 10000);
  }
  function stopChatTimer() { if (chatTimer) { clearInterval(chatTimer); chatTimer = null; } }

  async function refreshUnread() {
    try {
      const res = await api('feedbackUnread', {});
      const badge = $('navUnread');
      const n = Number(res.unread) || 0;
      badge.textContent = n > 99 ? '99+' : n;
      badge.style.display = n > 0 ? 'inline-block' : 'none';
    } catch (e) { /* 忽略 */ }
  }

  async function loadThreads(silent) {
    if (!silent) $('threadList').innerHTML = '<div class="empty-hint">加载中...</div>';
    try {
      const data = await api('listFeedback', {});
      const items = data.items || [];
      if (!items.length) {
        $('threadList').innerHTML = '<div class="empty-hint">暂无用户消息</div>';
        return;
      }
      $('threadList').innerHTML = items.map((t) => `
        <div class="thread-item ${t.id === activeThreadId ? 'active' : ''}" data-id="${t.id}">
          <div class="thread-top">
            <span class="thread-name">${escapeHtml(t.ownerName || '用户')}</span>
            ${t.unread > 0 ? `<span class="thread-unread">${t.unread}</span>` : `<span class="thread-time">${fmtShort(t.lastAt)}</span>`}
          </div>
          <div class="thread-last">${escapeHtml(t.lastMessage || '')}</div>
        </div>`).join('');

      $('threadList').querySelectorAll('.thread-item').forEach((el) => {
        el.addEventListener('click', () => openThread(el.dataset.id));
      });
    } catch (err) {
      if (err.code !== 'UNAUTHORIZED' && err.code !== 'TOKEN_EXPIRED') {
        if (!silent) $('threadList').innerHTML = `<div class="empty-hint">${escapeHtml(err.message || '加载失败')}</div>`;
      }
    }
  }

  async function openThread(threadId, silent) {
    activeThreadId = threadId;
    if (!silent) {
      $('chatBody').innerHTML = '<div class="chat-empty">加载中...</div>';
      document.querySelectorAll('.thread-item').forEach((el) => {
        el.classList.toggle('active', el.dataset.id === threadId);
      });
    }
    try {
      const data = await api('threadDetail', { threadId });
      $('chatTitle').textContent = (data.thread && data.thread.ownerName) || '会话';
      const messages = data.messages || [];
      $('chatBody').innerHTML = messages.length
        ? messages.map((m) => `
          <div class="msg-row ${m.from === 'admin' ? 'admin' : 'user'}">
            <div class="msg-bubble">${escapeHtml(m.content)}<span class="msg-time">${fmtTime(m.createdAt)}</span></div>
          </div>`).join('')
        : '<div class="chat-empty">还没有消息</div>';
      const body = $('chatBody');
      body.scrollTop = body.scrollHeight;

      $('replyInput').disabled = false;
      $('sendReply').disabled = false;
      $('deleteThread').style.display = 'inline-block';

      await api('markFeedbackRead', { threadId }).catch(() => {});
      if (!silent) loadThreads(true);
      refreshUnread();
      startChatTimer();
    } catch (err) {
      if (err.code !== 'UNAUTHORIZED' && err.code !== 'TOKEN_EXPIRED') toast(err.message || '加载会话失败');
    }
  }

  async function sendReply() {
    const input = $('replyInput');
    const content = input.value.trim();
    if (!content || !activeThreadId) return;
    const btn = $('sendReply');
    btn.disabled = true;
    try {
      await api('replyFeedback', { threadId: activeThreadId, content });
      input.value = '';
      await openThread(activeThreadId, true);
      loadThreads(true);
    } catch (err) {
      if (err.code !== 'UNAUTHORIZED' && err.code !== 'TOKEN_EXPIRED') toast(err.message || '发送失败');
    } finally {
      btn.disabled = false;
    }
  }

  $('sendReply').addEventListener('click', sendReply);
  $('replyInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); sendReply(); }
  });
  $('refreshThreads').addEventListener('click', () => loadThreads());
  $('deleteThread').addEventListener('click', async () => {
    if (!activeThreadId) return;
    if (!confirm('确定删除该用户的全部聊天记录吗？删除后不可恢复。')) return;
    try {
      await api('deleteFeedback', { threadId: activeThreadId });
      activeThreadId = null;
      $('chatTitle').textContent = '请选择会话';
      $('chatBody').innerHTML = '<div class="chat-empty">从左侧选择一个用户会话</div>';
      $('replyInput').disabled = true;
      $('sendReply').disabled = true;
      $('deleteThread').style.display = 'none';
      stopChatTimer();
      loadThreads(true);
      refreshUnread();
      toast('已删除');
    } catch (err) {
      if (err.code !== 'UNAUTHORIZED' && err.code !== 'TOKEN_EXPIRED') toast(err.message || '删除失败');
    }
  });

  function escapeHtml(str) {
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  /* ---------- 启动 ---------- */
  if (token && currentUser && currentUser.role === 'admin') {
    showApp();
  } else {
    token = '';
    $('loginView').style.display = 'flex';
  }
})();
</script>
</body>
</html>
